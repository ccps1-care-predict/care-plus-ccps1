include:
  - path: ./modules/api/docker-compose.yml
  - path: ./modules/services/public-health-ingestion-service/docker-compose.yml

services:
  frontend-angular:
    build:
      context: ./modules/spa
      dockerfile: Dockerfile.yml
      args:
        SPA_BUILD_CONFIGURATION: ${SPA_BUILD_CONFIGURATION:-docker}
    container_name: care_plus_spa
    ports:
      - "4200:4200"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  data-worker-etl:
    build:
      context: ./modules/data/data-worker-etl
    container_name: data-worker-etl
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/care_plus
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_RAW: careplus-raw
      MINIO_SECURE: "false"
      ETL_SOURCES: sinan,sinasc,sim,sih,sia,cnes,ibge
      ETL_INTERVAL_SECONDS: "86400"
      ETL_ENABLE_LOOP: "false"
    restart: on-failure

  ml-inference-service:
    build:
      context: ./modules/ml/smart-triage-health/ml_service
    container_name: ml-inference-service
    ports:
      - "8001:8001"
    environment:
      MODEL_PATH: /app/models/model.pkl
      PREPROCESSOR_PATH: /app/models/preprocessor.pkl
    volumes:
      - ./modules/ml/smart-triage-health/ml_service/models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  risk-scoring-engine:
    build:
      context: ./modules/services/risk-scoring-engine
    container_name: risk-scoring-engine
    ports:
      - "8004:8004"
    environment:
      ML_SERVICE_URL: http://ml-inference-service:8001
      DATABASE_URL: postgresql://postgres:postgres@db:5432/care_plus
    depends_on:
      db:
        condition: service_healthy
      ml-inference-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  recommendation-engine:
    build:
      context: ./modules/services/recommendation-engine
    container_name: recommendation-engine
    ports:
      - "8005:8005"
    depends_on:
      risk-scoring-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
